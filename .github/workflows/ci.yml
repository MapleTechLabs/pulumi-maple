name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    provider:
        name: Provider tests and generated code
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: provider/go.mod
                  cache-dependency-path: provider/go.sum

            - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
              with:
                  pulumi-version-file: .pulumi-version

            - name: Lint
              run: make lint

            # Mapping and secrets checks, then Pulumi YAML programs (create, update,
            # replace, refresh, import, destroy) against the in-process fake Maple API.
            - name: Test
              run: make test

            - name: Schema and SDKs are up to date
              run: |
                  make generate
                  if [ -n "$(git status --porcelain)" ]; then
                    echo "::error::generated code is stale: run make generate"
                    git status --porcelain
                    exit 1
                  fi

    sdks:
        name: SDKs build and type-check
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: provider/go.mod
                  cache-dependency-path: provider/go.sum

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
              with:
                  pulumi-version-file: .pulumi-version

            - name: Go SDK
              run: make build_go

            - name: Node SDK and the TypeScript example
              run: |
                  make build_nodejs
                  cd examples/typescript && npm install --no-audit --no-fund && npx tsc -p .
